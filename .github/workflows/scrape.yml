name: AccessBG to Temu
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scraper.py
      - name: Download results from Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessbg-temu-results
          path: output/
          if-no-files-found: error
          retention-days: 14
